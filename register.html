<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartSpend | Create Account</title>
  <script>document.documentElement.dataset.theme = localStorage.getItem('smartspendTheme') || 'night';</script>
  <link rel="stylesheet" href="./css/login.css" />
  <link rel="stylesheet" href="./css/pro-upgrade.css" />
</head>
<body>
<main class="login-page">
  <section class="login-card">
    <div class="auth-badge">Create Your Account</div>
    <h1 class="brand-title">Join SmartSpend</h1>
    <p class="brand-subtitle">Use your Gmail or school email to create a personal finance dashboard.</p>

    <form id="registerForm" class="login-form">
      <div class="form-group">
        <label for="register-name">Full Name</label>
        <input
          id="register-name"
          type="text"
          placeholder="e.g. Lucy Zhang"
          autocomplete="name"
          required
        />
      </div>

      <div class="form-group">
        <label for="register-email">Email</label>
        <input
          id="register-email"
          type="email"
          placeholder="name@gmail.com"
          autocomplete="email"
          required
        />
      </div>

      <div class="form-group">
        <label for="register-password">Password</label>
        <div class="password-field">
          <input
            id="register-password"
            type="password"
            placeholder="At least 8 characters"
            autocomplete="new-password"
            required
          />
          <button
            type="button"
            class="password-toggle"
            data-password-toggle="register-password"
            aria-pressed="false"
          >
            Show
          </button>
        </div>
      </div>

      <div class="form-group">
        <label for="register-confirm-password">Confirm Password</label>
        <div class="password-field">
          <input
            id="register-confirm-password"
            type="password"
            placeholder="Re-enter your password"
            autocomplete="new-password"
            required
          />
          <button
            type="button"
            class="password-toggle"
            data-password-toggle="register-confirm-password"
            aria-pressed="false"
          >
            Show
          </button>
        </div>
      </div>

      <p id="registerErrorMessage" class="error-message"></p>

      <button type="submit" class="sign-in-btn" id="register-submit-btn">Create Account</button>
    </form>

    <p class="auth-switch">
      Already have an account?
      <a href="./index.html">Sign in</a>
    </p>
  </section>
</main>

<script type="module" src="./js/theme.js"></script>
<script type="module" src="./js/register.js"></script>
</body>
</html>
